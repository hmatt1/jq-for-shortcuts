name: iOS Build

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history and tags: untagged pushes derive their version from the latest v* tag.
          fetch-depth: 0

      - name: Install dependencies
        run: brew install xcodegen

      - name: Run Tool Script Tests
        # Pure-Python tests for Tools/*.py, including the App Store listing
        # length limits, so a listing typo fails here in seconds.
        run: python3 -m unittest discover -s Tools -p 'test_*.py'

      - name: Run Filter Engine Tests
        # The jq engine is a plain Swift package, so it tests on the macOS
        # host without a Simulator: 1386 cases generated from real jq 1.7.1
        # (Packages/JQEngine/Tests/JQEngineTests/Fixtures), the requirement
        # fixtures from the design document (R9.13), every Preset and every
        # cheat sheet example.
        run: swift test --package-path Packages/JQEngine

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Unit Tests
        run: |
          # AppLogicTests (project.yml) compiles Shared/Core into a host-less
          # test bundle: the run pipeline, the R8 messages, output modes, the
          # JSON tools, the stores, the tree browser and the bundled content.
          # It is an iOS target, so it needs a Simulator. Any iPhone works.
          # `tail -1`: simctl lists runtimes oldest first, so the last iPhone
          # belongs to the newest runtime, which OS=latest below resolves to.
          SIM_NAME=$(xcrun simctl list devices available | grep -oE 'iPhone[^(]+' | tail -1 | sed -E 's/[[:space:]]+$//')
          if [ -z "$SIM_NAME" ]; then
            echo "No available iPhone simulator found. Registered devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Running AppLogicTests on \"$SIM_NAME\""

          xcodebuild test \
            -project JQForShortcuts.xcodeproj \
            -scheme JQForShortcuts \
            -only-testing:AppLogicTests \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=latest"

      - name: Import signing certificate and profiles
        # Pull requests stop after the tests: they have no access to the
        # signing secrets, and a PR build should never reach TestFlight.
        if: github.event_name != 'pull_request'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          IOS_PROFILE_SHARE_BASE64: ${{ secrets.IOS_PROFILE_SHARE_BASE64 }}
          IOS_PROFILE_CONTROLS_BASE64: ${{ secrets.IOS_PROFILE_CONTROLS_BASE64 }}
        run: |
          # One fixed Distribution certificate and three App Store profiles
          # (app, share extension, controls extension), created once by
          # Tools/setup-signing.py and imported into a temporary keychain on
          # every run. Automatic signing would mint a new certificate on each
          # fresh runner until the account's certificate cap is reached.
          for secret in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROFILE_APP_BASE64 IOS_PROFILE_SHARE_BASE64 IOS_PROFILE_CONTROLS_BASE64; do
            if [ -z "${!secret}" ]; then
              echo "Missing secret $secret. Run Tools/setup-signing.py and add its output to the repository secrets (see README)."
              exit 1
            fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # The runner label is not guaranteed to be a fresh VM, so the
          # cleanup step puts the prior keychain state back.
          echo "PRIOR_DEFAULT_KEYCHAIN=$(security default-keychain | sed 's/^ *"\(.*\)"$/\1/')" >> "$GITHUB_ENV"
          echo "PRIOR_KEYCHAIN_SEARCH_LIST=$(security list-keychains -d user | sed 's/"//g' | tr '\n' ' ')" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          # openssl, because macOS base64 spells its decode flag differently
          # from GNU base64.
          echo "$IOS_DIST_CERT_P12_BASE64" | openssl base64 -d -A > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # The existing search list is split into one argument per keychain on purpose.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          install_profile() {
            local b64="$1"
            local tmp_profile="$RUNNER_TEMP/profile.mobileprovision"
            echo "$b64" | openssl base64 -d -A > "$tmp_profile"
            local uuid
            # A here-string: PlistBuddy reading /dev/stdin from a live pipe is flaky.
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$tmp_profile")")
            cp "$tmp_profile" "$PROFILES_DIR/$uuid.mobileprovision"
            rm -f "$tmp_profile"
            echo "Installed profile $uuid"
          }

          install_profile "$IOS_PROFILE_APP_BASE64"
          install_profile "$IOS_PROFILE_SHARE_BASE64"
          install_profile "$IOS_PROFILE_CONTROLS_BASE64"

      - name: Archive
        if: github.event_name != 'pull_request'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            # Untagged push: every push still uploads to TestFlight. Before
            # the first tag that is 1.0.0. After it, the next patch version
            # after the latest v* tag, which is always higher than anything
            # released. The run number keeps each build unique.
            LATEST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')
            if [ -z "$LATEST" ]; then
              VERSION="1.0.0"
            else
              VERSION="${LATEST%.*}.$(( ${LATEST##*.} + 1 ))"
            fi
          fi
          echo "Building version $VERSION (build $GITHUB_RUN_NUMBER)"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

          # -configuration Release explicitly: Release uses the fixed
          # certificate and profiles (project.yml), Debug stays Automatic.
          # The version settings apply to the app and both extensions, which
          # App Store Connect requires to match.
          xcodebuild clean archive \
            -project JQForShortcuts.xcodeproj \
            -scheme JQForShortcuts \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath JQForShortcuts.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Check App Intents metadata
        if: github.event_name != 'pull_request'
        run: |
          # The seven Shortcuts actions run in the app process (R3.33, with
          # the app's memory budget and Run in App), so their metadata must
          # be in the app bundle and never in an extension. The two control
          # intents open the app, which needs them compiled into both the
          # app and the controls extension (Shared/Intents).
          APP_DIR=$(echo JQForShortcuts.xcarchive/Products/Applications/*.app)
          CONTROLS_DIR="$APP_DIR/PlugIns/JQControls.appex"
          SHARE_DIR="$APP_DIR/PlugIns/JQShareExtension.appex"
          echo "--- app Metadata.appintents:"; find "$APP_DIR" -maxdepth 2 -path '*Metadata.appintents*' | head -20
          echo "--- controls Metadata.appintents:"; find "$CONTROLS_DIR" -maxdepth 2 -path '*Metadata.appintents*' | head -20

          FAILED=0
          require() {
            if ! grep -rq "$1" "$2/Metadata.appintents" 2>/dev/null; then
              echo "ERROR: $1 is missing from $(basename "$2")'s App Intents metadata."
              FAILED=1
            fi
          }
          forbid() {
            if grep -rq "$1" "$2/Metadata.appintents" 2>/dev/null; then
              echo "ERROR: $1 must not be in $(basename "$2")'s App Intents metadata."
              FAILED=1
            fi
          }

          ACTIONS="RunJSONFilterIntent RunSavedFilterIntent ValidateJSONIntent FormatJSONIntent GetValueAtPathIntent SetValueAtPathIntent JSONToCSVIntent"
          for intent in $ACTIONS OpenAppScreenIntent RunSavedFilterOnClipboardIntent; do
            require "$intent" "$APP_DIR"
          done
          for intent in OpenAppScreenIntent RunSavedFilterOnClipboardIntent RunSavedFilterControlConfiguration; do
            require "$intent" "$CONTROLS_DIR"
          done
          for intent in $ACTIONS; do
            forbid "$intent" "$CONTROLS_DIR"
            forbid "$intent" "$SHARE_DIR"
          done
          exit $FAILED

      - name: Export and Upload to TestFlight
        if: github.event_name != 'pull_request'
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.ADMIN_APPSTORE_KEY_ID }}
          APPSTORE_P8_KEY: ${{ secrets.ADMIN_APPSTORE_P8_KEY }}
        run: |
          # The API key authenticates the upload. tr strips Windows line endings.
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$APPSTORE_P8_KEY" | tr -d '\r' > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

          # Manual signing with the same certificate and profiles as
          # project.yml's Release configuration.
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>teamID</key>
              <string>FHMS65N3XS</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.hmatt1.jqforshortcuts</key>
                  <string>JQ for Shortcuts App Store</string>
                  <key>com.hmatt1.jqforshortcuts.ShareExtension</key>
                  <string>JQ for Shortcuts Share Extension App Store</string>
                  <key>com.hmatt1.jqforshortcuts.Controls</key>
                  <string>JQ for Shortcuts Controls App Store</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath JQForShortcuts.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath export

          xcrun altool --upload-app \
            -f export/JQForShortcuts.ipa \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Remove signing keychain
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -n "$PRIOR_KEYCHAIN_SEARCH_LIST" ]; then
            # shellcheck disable=SC2086
            security list-keychains -d user -s $PRIOR_KEYCHAIN_SEARCH_LIST || true
          fi
          if [ -n "$PRIOR_DEFAULT_KEYCHAIN" ]; then
            security default-keychain -s "$PRIOR_DEFAULT_KEYCHAIN" || true
          fi
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf ~/.appstoreconnect/private_keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        with:
          name: JQForShortcuts-IPA
          path: export/JQForShortcuts.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: export/JQForShortcuts.ipa

      - name: Create Build Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "v${{ env.RELEASE_VERSION }} (build ${{ github.run_number }})"
          prerelease: false
          make_latest: true
          files: export/JQForShortcuts.ipa
